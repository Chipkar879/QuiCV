<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Builder | QuiCV</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%234f46e5'>Q</text></svg>">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <!-- Back to Home Link -->
  <div class="back-link">
    <a href="../../index.html">
      <i class="fa-solid fa-arrow-left"></i> Back to Home
    </a>
  </div>

  <div class="container">
    
    <!-- Left Side: Input Form -->
    <div class="form-section">
      <div class="header">
        <i class="fa-solid fa-q"></i>
        <h1>QuiCV Builder</h1>
      </div>
      <p class="subtitle">Fill in the details below to generate your professional resume.</p>

      <!-- Progress Steps -->
      <div class="progress-steps">
        <div class="step active" id="step1-indicator">
          <span class="step-number">1</span>
          <span class="step-label">Personal</span>
        </div>
        <div class="step-line"></div>
        <div class="step" id="step2-indicator">
          <span class="step-number">2</span>
          <span class="step-label">Professional</span>
        </div>
      </div>

      <!-- SECTION 1: Personal Details -->
      <div class="form-step active" id="step1">
        <div class="form-section-title">
          <span>01</span> Personal Details
        </div>

        <!-- Photo Upload -->
        <div class="form-group">
          <label><i class="fa-solid fa-camera"></i> Profile Photo</label>
          <div class="photo-upload">
            <div class="photo-preview" id="photoPreview">
              <i class="fa-solid fa-user"></i>
            </div>
            <input type="file" id="photo" accept="image/*" onchange="previewPhoto(event)">
            <div class="photo-buttons">
              <label for="photo" class="btn-upload-photo">
                <i class="fa-solid fa-upload"></i> Upload Photo
              </label>
              <button type="button" class="btn-remove-photo" id="btnRemovePhoto" onclick="removePhoto()" style="display: none;">
                <i class="fa-solid fa-trash"></i> Remove
              </button>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-user"></i> Full Name *</label>
          <input type="text" id="name" placeholder="e.g. John Doe" oninput="validateStep1()">
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-phone"></i> Phone Number</label>
          <input type="text" id="phone" placeholder="e.g. +1 234 567 890" oninput="validateStep1()">
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-envelope"></i> Professional Email</label>
          <input type="email" id="email" placeholder="e.g. john@company.com" oninput="validateStep1()">
        </div>

        <button type="button" class="btn-next" id="btnNext" onclick="goToStep2()" disabled>
          Next Step <i class="fa-solid fa-arrow-right"></i>
        </button>
      </div>

      <!-- SECTION 2: Professional Info -->
      <div class="form-step" id="step2">
        <div class="form-section-title">
          <span>02</span> Professional Info
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-user-tie"></i> Professional Summary</label>
          <textarea id="summary" placeholder="A brief 3-4 sentence paragraph highlighting your top skills..."></textarea>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-briefcase"></i> Work Experience</label>
          <textarea id="experience" placeholder="Company Name, Job Title&#10;Employment Dates&#10;• Key achievements with metrics"></textarea>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-graduation-cap"></i> Education</label>
          <textarea id="education" placeholder="Degree, University, Year&#10;GPA (optional)&#10;Dissertation topic (optional)"></textarea>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-code"></i> Skills</label>
          <textarea id="skills" placeholder="Hard Skills: HTML, CSS, JavaScript&#10;Soft Skills: Leadership, Communication"></textarea>
        </div>

        <div class="form-group">
          <label><i class="fa-solid fa-plus"></i> Additional Sections</label>
          <textarea id="additional" placeholder="Certifications, Licenses, Volunteer Experience, Publications, Associations"></textarea>
        </div>

        <div class="button-group">
          <button type="button" class="btn-back" onclick="goToStep1()">
            <i class="fa-solid fa-arrow-left"></i> Back
          </button>
          <button type="button" class="btn-generate" id="btnGenerate" onclick="generateResume()" disabled>
            <i class="fa-solid fa-wand-magic-sparkles"></i> Generate Resume
          </button>
        </div>
      </div>

    </div>

    <!-- Right Side: Resume Preview -->
    <div class="resume-section">
      <div class="resume-controls">
        <button onclick="window.print()" class="btn-print">
          <i class="fa-solid fa-print"></i> Print / PDF
        </button>
      </div>
      
      <div class="paper" id="resume-output">
        <div class="preview-placeholder">
          <i class="fa-solid fa-file-lines"></i>
          <p>Your resume preview will appear here...</p>
        </div>
      </div>
    </div>

  </div>

  <!-- JavaScript -->
  <script src="../script.js"></script>
</body>

</html>
